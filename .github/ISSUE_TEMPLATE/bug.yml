name: 🐛 Bug
description: Signaler un bug
title: "[BUG] "
labels:
  - "type: bug"
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Décris clairement le problème.
      placeholder: Que s'est-il passé ?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur...
        2. Cliquer sur...
        3. Observer...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environnement
      placeholder: OS, navigateur, version, etc.
